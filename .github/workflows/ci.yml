name: GarStreamTx CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout GarStreamTx parent and pinned children
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Checkout canonical GAR main
        uses: actions/checkout@v4
        with:
          repository: ThousandsOfTies/GaplessAgentRuntime
          ref: main
          path: _gar
          persist-credentials: false
      - name: Checkout shared GarStream system/scenario owner
        uses: actions/checkout@v4
        with:
          repository: ThousandsOfTies/GarStreamRx
          ref: main
          path: _rx-system
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parent tests and shell syntax checks
        run: |
          python -m unittest discover -s tests -v
          bash -n \
            scripts/product-sim-build.sh \
            scripts/product-sim-env-build.sh \
            scripts/product-target-build.sh \
            scripts/target/package.sh
          make check-target
      - name: Build actual simulation and Target hook bundles
        run: |
          rm -rf artifacts/ci artifacts/from-codespace
          mkdir -p artifacts/ci
          bash scripts/product-sim-build.sh
          mv artifacts/from-codespace artifacts/ci/sim
          bash scripts/product-target-build.sh
          mv artifacts/from-codespace artifacts/ci/target
      - name: Validate with GAR canonical contracts
        if: always()
        run: |
          # GAR main still probes the former multi-target binding path.
          # Keep that compatibility alias ephemeral; the Product owns one
          # canonical binding at hardware/binding.json.
          mkdir -p hardware/bindings
          ln -s ../binding.json hardware/bindings/raspberry-pi-5.json
          python _gar/.github/scripts/garstream-parent-validate.py \
            --gar-root _gar \
            --product-root . \
            --sim-bundle artifacts/ci/sim \
            --target-bundle artifacts/ci/target \
            --sim-target linux-device \
            --sim-architecture aarch64 \
            --sim-abi gnu \
            --sim-toolchain aarch64-linux-gnu \
            --sim-payload python \
            --sim-entry files/gar-stream-tx \
            --target raspberry-pi-5 \
            --target-architecture aarch64 \
            --target-abi gnu \
            --target-toolchain aarch64-linux-gnu \
            --target-payload python \
            --target-entry files/gar-stream-tx \
            --target-build-mode production \
            --system-file _rx-system/gar-system.json \
            --scenario-file _rx-system/scenarios/garstream_golden.json \
            --report artifacts/ci/validation-report.json
      - name: Retain product bundles and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gar-stream-tx-parent-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 14
